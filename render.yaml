# Render Blueprint for the LuvuPay hackathon demo (sandbox money only).
# Setup: New → Blueprint → pick this repo → fill every `sync: false` value in the dashboard.
#   APP_KEY: run locally `php artisan key:generate --show`   (must start with base64:)
# After the first deploy, open the web service Shell once:
#   LUVUPAY_ALLOW_DEMO_SEED=true php artisan db:seed --force      # creates owner@demomerchant.test (see docs/DEMO_RUNBOOK_90S.md)
#   php artisan luvupay:demo-check --live                         # must print GO
services:
  - type: web
    name: luvupay-web
    runtime: docker
    plan: starter            # free instances sleep: a sleeping demo URL fails recordings
    healthCheckPath: /up
    dockerCommand: sh -c "php artisan migrate --force && php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=${PORT:-8000}"
    envVars: &appenv
      - { key: APP_ENV, value: production }
      - { key: APP_DEBUG, value: "false" }
      - { key: APP_KEY, sync: false }
      - { key: APP_URL, sync: false }                    # https://<your-service>.onrender.com
      - { key: TRUSTED_PROXIES, value: "*" }             # Render's load balancer terminates TLS
      - { key: AUDIT_HMAC_KEY, generateValue: true }
      - { key: DB_CONNECTION, value: pgsql }
      - { key: DB_URL, fromDatabase: { name: luvupay-db, property: connectionString } }
      - { key: CACHE_STORE, value: database }
      - { key: SESSION_DRIVER, value: database }
      - { key: QUEUE_CONNECTION, value: database }      # `jobs` table ships with the migrations
      - { key: LUVUPAY_PAYMENT_DRIVER, value: paypal }
      - { key: PAYPAL_MODE, value: sandbox }
      - { key: PAYPAL_CLIENT_ID, sync: false }
      - { key: PAYPAL_SECRET, sync: false }
      - { key: AG_GRID_LICENSE_KEY, sync: false }
      - { key: PAYPAL_WEBHOOK_ID, sync: false }          # required at boot when the driver is paypal
      - { key: PAYPAL_MERCHANT_SANDBOX_EMAIL, sync: false }
      - { key: PAYPAL_CHARITY_SANDBOX_EMAIL, sync: false }
      - { key: LUVUPAY_PAYOUT_SANDBOX_FALLBACK, value: "false" }   # withdrawals must not fake a batch id on camera
      - { key: LUVUPAY_DEMO_SIMULATOR, value: "true" }             # demo instance only
      - { key: LUVUPAY_ALLOW_DEMO_SEED, value: "true" }            # demo instance only
      - { key: NEBIUS_ENABLED, value: "true" }
      - { key: NEBIUS_API_KEY, sync: false }
      - { key: NEBIUS_MODEL, value: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B }
      - { key: SMART_CONVERT_STRICT, value: "true" }
      - { key: MARKETPLACE_AUTO_PAYOUT, value: "true" }
      - { key: MARKETPLACE_REQUIRE_SELLER_VERIFICATION, value: "true" }
      - { key: MAIL_MAILER, value: log }                 # emails (verification links) appear in the service logs; use smtp for real delivery

  # Queue worker + scheduler: seller payouts, webhook retries, resale:maintain (re-queues stuck payouts every minute)
  - type: worker
    name: luvupay-worker
    runtime: docker
    plan: starter
    dockerCommand: sh -c "php artisan schedule:work & exec php artisan queue:work --queue=financial,webhooks,default --tries=3 --sleep=1"
    envVars: *appenv

databases:
  - name: luvupay-db
    plan: basic-256mb
    databaseName: luvupay
